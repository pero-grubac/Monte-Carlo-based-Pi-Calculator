name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'readme_assets/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'readme_assets/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MonteCarloPi.slnx

      - name: Build
        run: dotnet build MonteCarloPi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MonteCarloPi.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

      - name: Publish the app
        run: dotnet publish src/MonteCarloPi.Desktop --configuration Release --runtime win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output publish

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: MonteCarloPi-win-x64
          path: publish/MonteCarloPi.exe
          retention-days: 14
